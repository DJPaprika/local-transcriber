<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-transcriber</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>local-transcriber</h1>
  <span class="sub">本地离线语音转写 · 视频 → 字幕</span>
</header>

<main>

  <!-- 新建任务 -->
  <section class="panel">
    <h2>新建转写</h2>
    <form id="form">
      <div id="dropzone" class="dropzone" tabindex="0">
        <strong>把视频或音频拖到这里</strong>
        <span>mp4 / mkv / webm / mov / mp3 / wav / m4a / flac 等，单个上限 8 GB</span>
        <span class="pick">或点击选择文件</span>
      </div>
      <input type="file" id="filepicker" accept="video/*,audio/*" multiple hidden>
      <div id="upload-note" class="note"></div>

      <label class="field">
        <span>视频链接或本地文件</span>
        <input id="source" type="text" placeholder="https://... 或 D:\videos\a.mp4" autocomplete="off">
      </label>

      <div class="row">
        <label class="field">
          <span>输出名</span>
          <input id="name" type="text" placeholder="留空 = 用视频标题（与 CLI 一致）" autocomplete="off">
        </label>
        <label class="field narrow">
          <span>引擎</span>
          <select id="engine">
            <option value="sensevoice">SenseVoice（快）</option>
            <option value="whisper">Whisper（多语种）</option>
          </select>
        </label>
        <label class="field narrow">
          <span>语言</span>
          <select id="language">
            <option value="auto">自动</option>
            <option value="zh">中文</option>
            <option value="en">英文</option>
            <option value="ja">日文</option>
            <option value="ko">韩文</option>
            <option value="yue">粤语</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="submit">开始转写</button>
        <span id="form-error" class="err"></span>
      </div>
    </form>
  </section>

  <!-- 任务列表 -->
  <section class="panel">
    <div class="panel-head">
      <h2>任务</h2>
      <button id="refresh" class="ghost" type="button">刷新</button>
    </div>
    <div id="jobs" class="jobs">
      <p class="empty">还没有任务</p>
    </div>
  </section>

  <!-- 本地模型服务 -->
  <section class="panel">
    <div class="panel-head">
      <h2>本地模型服务</h2>
      <span id="llm-state" class="hint">查询中……</span>
    </div>
    <label class="check">
      <input type="checkbox" id="keep-server">
      <span>常驻：批量摘要 / 翻译时不要每次重新加载模型</span>
    </label>
    <div class="actions">
      <button id="stop-llm" class="ghost" type="button">停掉服务</button>
      <span class="hint">llama-server 监听 127.0.0.1:8080，只有摘要 / 翻译 / 问答用到</span>
    </div>
  </section>

</main>

<template id="job-tpl">
  <article class="job">
    <div class="job-head">
      <span class="badge"></span>
      <span class="job-kind"></span>
      <span class="job-name"></span>
      <span class="job-time"></span>
      <button class="cancel ghost" type="button">取消</button>
      <button class="delete ghost" type="button">删除</button>
    </div>
    <div class="bar"><i></i></div>
    <div class="job-detail"></div>
    <details class="log-wrap">
      <summary>日志</summary>
      <pre class="log"></pre>
    </details>
    <div class="job-actions"></div>
  </article>
</template>

<script src="/static/app.js"></script>
</body>
</html>
